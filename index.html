<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Sah - Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">AdiMori<span style="color: var(--contact-link)">.</span></div>
                <div class="nav-links">
                    <a href="#home">Home</a>
                    <a href="#contact">Contact</a>
                </div>
                <div class="nav-controls">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="mobile-menu-btn" aria-label="Toggle Navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="container">
            <h1>Tracking Memories<span style="color: var(--contact-link)">.</span></h1>
            <p>Where every second tells a story</p>
        </div>
    </section>

    <main class="container">
        <div id="tiles-container" class="grid-layout">
            <!-- Tiles will be injected here by script.js -->
        </div>
    </main>

    <section id="contact" class="contact">
        <div class="container">
            <h2>Get In Touch</h2>
            <div class="contact-content">
                <p>Feel free to reach out to me for collaborations or any questions.</p>
                <a href="mailto:adityasah2030@gmail.com" class="contact-email">adityasah2030@gmail.com</a>
                
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/adityasah2030" class="social-link" title="LinkedIn" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://www.github.com/AdityaSah2030" class="social-link" title="GitHub" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://twitter.com/adityasah2030" class="social-link" title="Twitter" target="_blank" rel="noopener noreferrer">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                    <a href="http://www.instagram.com/adityasah2030" class="social-link" title="Instagram" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p class="copyright">© 2026 Aditya Sah. All rights reserved.</p>
        </div>
    </footer>

    <div class="back-to-top">
        <i class="fas fa-arrow-up"></i>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>

</html>
